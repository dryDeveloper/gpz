<table mat-table [dataSource]="solicitudes" class="mat-elevation-z4" #solicitudesTable>
  <ng-container matColumnDef="folio">
    <th mat-header-cell *matHeaderCellDef>FOLIO</th>
    <td mat-cell *matCellDef="let element">{{ element.folio }}</td>
  </ng-container> 

  <ng-container matColumnDef="tipoPersona">
    <th mat-header-cell *matHeaderCellDef>TIPO PERSONA</th>
    <td mat-cell *matCellDef="let element">{{ element.tipoPersona }}</td>
  </ng-container> 

  <ng-container matColumnDef="tipoProyecto">
    <th mat-header-cell *matHeaderCellDef>TIPO PROYECTO</th>
    <td mat-cell *matCellDef="let element">{{ element.tipoProyecto }}</td>
  </ng-container> 

  <ng-container matColumnDef="fCaptura">
    <th mat-header-cell *matHeaderCellDef>FECHA CAPTURA</th>
    <td mat-cell *matCellDef="let element">{{ element.fCaptura }}</td>
  </ng-container> 

  <ng-container matColumnDef="modalidad">
    <th mat-header-cell *matHeaderCellDef>MODALIDAD</th>
    <td mat-cell *matCellDef="let element">{{ element.modalidad }}</td>
  </ng-container> 

  <ng-container matColumnDef="nombreCompleto">
    <th mat-header-cell *matHeaderCellDef>NOMBRE COMPLETO</th>
    <td mat-cell *matCellDef="let element">{{ element.nombreCompleto }}</td>
  </ng-container> 

  <ng-container matColumnDef="rfc">
    <th mat-header-cell *matHeaderCellDef>RFC</th>
    <td mat-cell *matCellDef="let element">{{ element.rfc }}</td>
  </ng-container> 

  <ng-container matColumnDef="tTramite">
    <th mat-header-cell *matHeaderCellDef>TIPO TRAMITE</th>
    <td mat-cell *matCellDef="let element">{{ element.tTramite }}</td>
  </ng-container> 

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns;"></tr>
</table>
