<h1>Solicitud para impresion</h1>

<button type="button" mat-raised-button (click)="generateTemplate()">Obtener solicitudes</button>
<button type="button" mat-mini-fab (click)="printSolicitudes()">
  <mat-icon>print</mat-icon>
</button>

<mat-tab-group>

<mat-tab label="lista de solicitudes">
  <app-solicitud-list [solicitudes]="solicitudes"></app-solicitud-list>
</mat-tab>

<mat-tab label="para impresion">
  <div id='printTarget'>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">

    <div *ngFor="let solicitud of solicitudes">

      <app-solicitud [solicitud]="solicitud"></app-solicitud> 

    </div>

  </div>

</mat-tab>  

</mat-tab-group>
