<div>

  <button type="button" mat-raised-button (click)="fileInput.click()">Seleccionar archivo</button>
  <input type="file" hidden (change)="addFile($event)" #fileInput id="file">

  <button *ngIf="rawData" mat-mini-fab type="button" (click)="showRawData()" tooltip="mostrar solicitudes">
    <mat-icon>visibility</mat-icon>
  </button>

</div>

<div *ngIf="rawData">
  
  <h1>Datos Crudos</h1>
  <table mat-table [dataSource]="data" class="mat-elevation-z4" >

    <ng-container *ngFor="let header of headers" [matColumnDef]="header">
      <th mat-header-cell *matHeaderCellDef>{{ header }}</th>
      <td mat-cell *matCellDef="let element">{{ element[header] }}</td>
    </ng-container>  

    <!-- <ng-container matColumnDef="Folio"> -->
    <!--   <th mat-header-cell *matHeaderCellDef>Folio</th> -->
    <!--   <td mat-cell *matCellDef="let element">{{ element.Folio }}</td> -->
    <!-- </ng-container>   -->
    <!--  -->
    <!-- <ng-container matColumnDef="Modalidad"> -->
    <!--   <th mat-header-cell *matHeaderCellDef>Modalidad</th> -->
    <!--   <td mat-cell *matCellDef="let element">{{ element.Modalidad }}</td> -->
    <!-- </ng-container>   -->

    <tr mat-header-row *matHeaderRowDef="headers"></tr>
    <tr mat-row *matRowDef="let row; columns: headers"></tr>
  </table>

</div>
