<div class="card">
  <p-menubar [model]="items">
    <ng-template #end>
      <div class="flex items-center gap-2">
        <p-button label="logout" (click)="logOut()" class="w-20" styleClass="w-full mx-auto" />
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          shape="circle"
        />
      </div>
    </ng-template>
  </p-menubar>
</div>
@if(users()) {
  <div class="card">
    <p-table [value]="users()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>ProfileId</th>
                <th>Username</th>
                <th>ProfileName</th>
                <th>Firstname</th>
                <th>Lastname</th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.profileId }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.profileName }}</td>
                <td>{{ user.firstname }}</td>
                <td>{{ user.lastname }}</td>
            </tr>
        </ng-template>
    </p-table>
  </div>
}
